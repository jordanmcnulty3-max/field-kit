<!-- ============ EMERGENCY ============ -->
<section class="tab" id="tab-emergency" hidden>
  <div id="emHome">
    <div id="emResume"></div>
    <div class="em-life" id="emLife"></div>
    <div class="em-chooser" id="emChooser" role="group" aria-label="Who is not breathing?" hidden></div>
    <div id="emActive" class="em-actives"></div>
    <div id="emPinned"></div>
    <div id="emRecent"></div>
    <div id="emCats">
      <div id="emCatsDyn"></div>
      <details class="ref" data-cat="tools">

        <div class="body">
          <div class="em-grid">

            <button type="button" class="em-btn" data-tool="cpr"><span>CPR coach</span></button>
            <button type="button" class="em-btn" data-tool="rate"><span>Rate counter</span></button>
