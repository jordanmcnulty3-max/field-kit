# Runs on every push to any branch. Nothing here deploys: GitHub Pages still serves the committed root files from main.
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Build and tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # some tests compare content with older commits
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Build
        run: python build.py _site
      - name: Committed build matches src
        # The root files are what Pages serves. If src/ changed and build.py was not re-run, phones would get the old app.
        run: |
          for f in index.html sw.js manifest.json leaflet.js leaflet.css; do
            cmp -s "$f" "_site/$f" || { echo "::error file=$f::$f is out of date with src/. Run python3 build.py and commit."; exit 1; }
          done
      - name: Release check (no draft content)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: python build.py --release _site
      - run: python -m playwright install --with-deps chromium
      - name: Install the test font
        # Layout tests measure text; use the same Roboto files the expected sizes were taken with.
        run: mkdir -p ~/.local/share/fonts && cp tests/fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f
      - name: Tests
        run: python -m pytest -q -n auto -p no:cacheprovider

  iphone:
    name: iPhone engine (WebKit) layout
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # some tests compare content with older commits
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps webkit
      - name: Install the test font
        # Layout tests measure text; use the same Roboto files the expected sizes were taken with.
        run: mkdir -p ~/.local/share/fonts && cp tests/fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f
      - name: Sheets, screens and buttons fit in Safari's engine
        env:
          FK_BROWSER: webkit
        run: >
          python -m pytest -q -n auto -p no:cacheprovider
          tests/test_tactical_layout.py tests/test_sheet.py tests/test_bal_editor.py
          tests/test_home.py tests/test_survival_home.py

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build
        run: python build.py _site
      - name: Audit Survival, Tactical map and Emergency
        run: npx --yes @lhci/cli@0.16.1 autorun
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-report
          path: lhci-report/
          if-no-files-found: ignore
